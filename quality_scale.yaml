# Home Assistant Integration Quality Scale
# Documentation: https://developers.home-assistant.io/docs/integration_quality_scale_index/

# MeatPi Integration Quality Scale Assessment
# (brand: MeatPi; devices: WiCAN OBD/USB/Pro, ESPNetlink upcoming;
#  HA domain remains `wican` — see notes/MEATPI_INTEGRATION_PLAN.md D1)
# Current: Platinum on the code side — all three Platinum rules verified
# (strict mypy with normal import following; injected websession; all-async
# I/O). The `brands` logo/icon PR to home-assistant/brands remains the only
# item, and it is an external submission, not a code change.
# 2026-07 robustness audit: all findings fixed (notes/ROBUSTNESS_AUDIT_2026-07.md)

