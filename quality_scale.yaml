# ============================================================================
# INTEGRATION CHARACTERISTICS
# ============================================================================

integration_characteristics:
  integration_type: device
  iot_class: local_push
  
  platforms:
    - platform: sensor
      entities: "status + dynamic PID sensors"
      state_class: "measurement (latched per-PID once a numeric value is seen; text PIDs stay stateless)"

    - platform: binary_sensor
      entities: "BLE, ECU, Sleep, VPN status"
      device_class: "connectivity"

    - platform: button
      entities: "Restart, Sync time"
      notes: "Capability-gated: created only on devices whose HTTP-API probe finds the V6 control surface (Sync time additionally requires the rtc_manager component)"
      
  communication:
    protocol: "HTTP webhooks (telemetry, all firmware) + device HTTP API (control/discovery, firmware V6+)"
    direction: "push from device; control commands pushed to device on user action"
    local: true
    cloud: false

  device_framework:
    profiles: "Declarative device-type profiles (devices.py): wican, wican_usb, wican_pro, espnetlink, generic meatpi fallback"
    capabilities: "Runtime probe of /api/status + /api/settings gates control entities; legacy devices unaffected"
    migration: "Config entries 1.1 → 1.2 backfill device_type from hw_version"

  discovery:
    method: "Zeroconf mDNS"
    service_type: "_meatpi._tcp.local (all products) + _wican._tcp.local"
    fallback: "_http._tcp.local (legacy firmware)"
    automatic: true
    confirmation: "required after onboarding"
    
  reliability:
    coordinator: "DataUpdateCoordinator with push updates"
    fallback: "Health check every 5 minutes marks stale device unavailable"
    retry_logic: "Exponential backoff with 3 retries"
    ip_caching: "5-minute cache for mDNS resolution"
    registration_coalescing: "Concurrent re-registrations fold into one run + one trailing rerun"
    gps_filtering: "Fixes worse than 200 m accuracy cannot move an already-located vehicle"
    hardened_data_path: "Hostile/corrupt payloads degrade gracefully; proven by failure-injection suites"
    
  requirements:
    firmware: "v2.00+ recommended (MAC-based discovery)"
    network: "Local network access"
    ports: "HTTP (device web interface)"

