rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register any service actions.
  appropriate-polling:
    status: exempt
    comment: >
      Local push integration. The device POSTs data to a Home Assistant
      webhook; the coordinator only keeps a 300s fallback interval for health
      checks and does not actively poll the device.
  brands:
    status: todo
    comment: Logo and icon PR to home-assistant/brands still required.
  common-modules:
    status: done
    comment: Coordinator in coordinator.py, base entity in entity.py, models.py.
  config-flow-test-coverage:
    status: done
    comment: config_flow.py at 100% line coverage.
  config-flow:
    status: done
    comment: >
      User and zeroconf flows implemented with data_description keys; manual
      flow sets a unique_id.
  dependency-transparency:
    status: done
    comment: No external requirements; only the internal webhook dependency.
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description:
    status: done
    comment: README opens with what WiCAN is and what the integration does.
  docs-installation-instructions:
    status: done
    comment: README has prerequisites + HACS/My HA step-by-step install.
  docs-removal-instructions:
    status: done
    comment: README has a "Removing the integration" section.
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup:
    status: done
    comment: Dispatcher subscribed in async_added_to_hass via async_on_remove.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: entry.runtime_data typed as WiCANRuntimeData / WiCANConfigEntry.
  test-before-configure:
    status: exempt
    comment: >
      Device pushes to Home Assistant; there is no device connection to
      validate at config time.
  test-before-setup:
    status: exempt
    comment: >
      Local push integration: the device initiates contact by POSTing to a
      Home Assistant webhook, so there is no device connection to validate at
      setup time. Setup only wires up local webhook handling (which cannot
      fail transiently); an unreachable device is surfaced later via the
      repair issue raised by webhook registration.
  unique-config-entry:
    status: done
    comment: Zeroconf uses MAC/device_id; manual flow dedupes on the address.

  # Silver
  action-exceptions:
    status: done
    comment: >
      Button presses (restart, sync time) raise translated HomeAssistantError
      on API failure or when the control API is unavailable.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unregisters webhook and unloads platforms.
  docs-configuration-parameters:
    status: done
    comment: >
      README documents the Post Interval and history-backfill options
      (defaults, ranges, effects) plus a dedicated history-backfill section.
  docs-installation-parameters:
    status: done
    comment: README documents the manual setup inputs (mdns, host).
  entity-unavailable:
    status: done
    comment: >
      Coordinator tracks last push time and raises UpdateFailed when the device
      goes stale, so all coordinator entities become unavailable.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: >
      DataUpdateCoordinator logs the stale (UpdateFailed) transition and the
      subsequent recovery once each.
  parallel-updates:
    status: done
    comment: >
      Set on sensor, binary_sensor, button, device_tracker, and update
      platforms.
  reauthentication-flow:
    status: exempt
    comment: Device has no authentication.
  test-coverage:
    status: done
    comment: >
      97.4% overall, 616 tests (coordinator.py, device_tracker.py,
      binary_sensor.py, button.py, api.py, devices.py at 100%). Includes an
      end-to-end
      device simulator plus failure-injection suites (test_device_chaos.py,
      test_hardening.py) covering hostile payloads, floods, identity glitches,
      and lifecycle races.

  # Gold
  devices:
    status: done
  diagnostics:
    status: done
  discovery-update-info:
    status: done
    comment: Zeroconf re-discovery refreshes stored mdns/host connection info.
  discovery:
    status: done
    comment: Zeroconf discovery with confirm step.
  docs-data-update:
    status: done
    comment: README "How data updates work" explains the push/webhook model.
  docs-examples:
    status: done
    comment: README has automation examples (low battery, arrived home).
  docs-known-limitations:
    status: done
    comment: README has a "Known limitations" section.
  docs-supported-devices:
    status: done
    comment: >
      README lists WiCAN OBD-II / Pro / USB plus upcoming ESPNetlink and the
      generic MeatPi device contract (notes/ADDING_A_DEVICE.md).
  docs-supported-functions:
    status: done
    comment: README "Supported functionality" lists entities per platform.
  docs-troubleshooting:
    status: done
    comment: README has a Troubleshooting section.
  docs-use-cases:
    status: done
    comment: README has a "Use cases" section.
  dynamic-devices:
    status: exempt
    comment: >
      One device per config entry; no post-setup device enumeration. Dynamic
      PID entities are added at runtime within the single device.
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: Per-cell HV voltage/deterioration PID sensors default to disabled.
  entity-translations:
    status: done
    comment: >
      All static entities (sensor, binary_sensor, button, device_tracker,
      update) use translation_key with translated names. Dynamic PID sensors are named
      from device-provided OBD-II keys that are unknown ahead of time and
      therefore cannot be pre-translated (documented limitation).
  exception-translations:
    status: done
    comment: >
      All user-facing raised HomeAssistantError/ConfigEntryError use
      translation_domain + translation_key with matching entries under
      exceptions (device_mismatch, connection_error, wican_error, firmware
      download/upload/version, update_in_progress, device_unreachable,
      api_not_available, api_command_failed).
  icon-translations:
    status: done
    comment: >
      Static sensor/binary_sensor/button entities use icons.json (the restart
      button inherits its device-class icon). Dynamic PID sensors use runtime
      device_class-derived icons (keys unknown ahead of time); device_tracker
      uses a single fixed icon.
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure updates host/mDNS and reloads the entry.
  repair-issues:
    status: done
    comment: >
      A repair issue is raised when webhook registration fails after all
      retries and cleared on the next successful registration or on unload.
  stale-devices:
    status: exempt
    comment: >
      One device per config entry, removed with the entry; no multi-device
      enumeration to prune.

  # Platinum
  async-dependency:
    status: done
    comment: All I/O is async; no synchronous external dependency.
  inject-websession:
    status: done
    comment: Uses async_get_clientsession(hass).
  strict-typing:
    status: done
    comment: >
      mypy --strict passes with 0 errors across all modules (see
      [tool.mypy] in pyproject.toml). WiCANConfigEntry is used throughout.
